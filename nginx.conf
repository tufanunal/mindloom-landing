server {
    listen 8090;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint for Container ML_A
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","container":"ML_A","service":"mindloom-landing"}';
    }

    # SPA / Static route fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
